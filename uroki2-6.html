 if(!synth){toast("Озвучка не поддерживается в этом браузере");if(cb)cb();return}
 var u=new SpeechSynthesisUtterance(t);u.lang="es-ES";
 var v=synth.getVoices().filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf("es")===0})[0];
 if(v)u.voice=v;u.rate=rate;u.pitch=who==="m"?.85:1.15;
 u.onend=function(){if(cb)cb()};u.onerror=function(){if(cb)cb()};synth.speak(u)}
function halt(){tok++;if(synth)synth.cancel();document.querySelectorAll(".bub.now").forEach(function(b){b.classList.remove("now")})}
function one(t){halt();say(t,"c")}
function sp(t){return '<button class="sp" data-t="'+t.replace(/"/g,"&quot;")+'" aria-label="Слушать">&#9654;</button>'}
function draw(){
 var x=L[cur];
 $("#app").innerHTML='<a class="back" href="index.html">К меню курса</a><h1>'+x.t+'</h1><p class="mute">'+x.g+'</p>'
 +'<h2>Диалог</h2><div class="bar"><button class="b" id="play">Слушать всё</button><button class="b g" id="stop">Стоп</button><button class="b g" id="tr">Перевод: '+(showRu?"вкл":"выкл")+'</button><button class="b g" id="pr">Я мастер: '+(prac?"вкл":"выкл")+'</button><button class="b g" id="spd">Скорость: '+({.9:"средняя",.7:"медленная",1:"обычная"}[rate])+'</button></div>'
 +'<div class="chat'+(showRu?"":" noru")+'" id="chat">'+x.d.map(function(r,i){return '<div class="bub '+r[0]+(prac&&r[0]==="m"?" hide":"")+'" data-i="'+i+'"><small>'+(r[0]==="m"?"Ты (мастер)":"Клиент")+'</small><div class="es">'+r[1]+'</div><div class="ru">'+r[2]+'</div></div>'}).join("")+'</div>'
 +'<h2>Фразы урока</h2>'+x.p.map(function(r){return '<div class="card row"><div><div class="es">'+r[0]+'</div><div class="ru">'+r[1]+'</div></div>'+sp(r[0])+'</div>'}).join("")
 +'<h2>Все слова урока ('+WL[cur].length+')</h2><p class="mute">Каждое слово из диалога, фраз и тестов этого урока, по алфавиту.</p><div class="grid">'+WL[cur].map(function(r){return '<div class="card row"><div><div class="es">'+r[0]+'</div><div class="ru">'+r[1]+'</div></div>'+sp(r[2])+'</div>'}).join("")+'</div>'
 +'<h2>Сообщение в WhatsApp</h2><div class="tpl" id="tpl">'+x.m+'</div><p class="ru">'+x.mr+'</p><div class="bar"><button class="b" id="cp">Скопировать</button></div>'+quizHtml();
 document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("cur",a.getAttribute("href")==="#"+cur)})}
function run(i,t){
 if(t!==tok)return;var D=L[cur].d;if(i>=D.length){halt();return}
 var b=$('.bub[data-i="'+i+'"]');document.querySelectorAll(".bub.now").forEach(function(n){n.classList.remove("now")});
 b.classList.add("now");b.scrollIntoView({block:"center",behavior:"smooth"});var x=D[i];
 if(prac&&x[0]==="m"){toast("Ответь вслух");setTimeout(function(){if(t!==tok)return;b.classList.remove("hide");say(x[1],"m",function(){setTimeout(function(){run(i+1,t)},500)})},6000)}
 else{say(x[1],x[0],function(){setTimeout(function(){run(i+1,t)},prac?300:500)})}}
document.addEventListener("click",function(e){
 var tp=e.target.closest("[data-r]");if(tp){var cc=tp.closest("[data-q]");if(!cc.dataset.done){toast("Сначала выбери ответ");return}cc.querySelector(".trn").classList.toggle("on");return}
 var t=e.target.closest("[data-t]");if(t){one(t.dataset.t);return}
 var b=e.target.closest(".bub");if(b){var r=L[cur].d[b.dataset.i];b.classList.remove("hide");b.classList.toggle("showru");one(r[1]);return}
 var o=e.target.closest("[data-o]");if(o){var c=o.closest("[data-q]");if(c.dataset.done)return;if(o.dataset.o==="0"){o.classList.add("ok");c.dataset.done=1;c.querySelector(".trn").classList.add("on")}else o.classList.add("no");return}
 var id=e.target.id;
 if(id==="play"){halt();var tk=tok;run(0,tk)}
 else if(id==="stop")halt();
 else if(id==="tr"){showRu=!showRu;draw()}
 else if(id==="pr"){halt();prac=!prac;draw()}
 else if(id==="spd"){rate=rate===.9?.7:rate===.7?1:.9;draw()}
 else if(id==="cp"){try{navigator.clipboard.writeText($("#tpl").textContent).then(function(){toast("Скопировано")},function(){toast("Выдели текст и скопируй вручную")})}catch(x){toast("Выдели текст и скопируй вручную")}}});
function route(){var h=(location.hash||"#l2").slice(1);cur=L[h]?h:"l2";halt();draw();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
if(synth&&synth.getVoices)synth.getVoices();
</script>
</body>
</html>
